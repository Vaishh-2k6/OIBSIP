<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vaishnavi's Authentication System | Forgot Password</title>
    <script>
      if (window.location.protocol === 'file:') {
        const page = window.location.pathname.split('/').pop() || 'forgot-password.html';
        const target = page === 'index.html' ? '/' : '/' + page;
        window.location.href = 'http://127.0.0.1:3000' + target;
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div class="page-shell">
      <main class="auth-card single-card">
        <section class="form-panel">
          <div class="form-card">
            <div class="form-head">
              <h2>Reset password</h2>
              <p>This is a polished demo screen for the forgot-password flow.</p>
            </div>
            <form>
              <div class="input-group">
                <label for="resetEmail">Email</label>
                <div class="input-shell">
                  <span class="input-icon">✉️</span>
                  <input id="resetEmail" type="email" placeholder="" />
                </div>
              </div>
              <button class="primary-btn" type="button">Send reset link</button>
            </form>
            <div class="switch-link">
              <p><a href="/index.html">Back to login</a></p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/api.js"></script>
  </body>
</html>
